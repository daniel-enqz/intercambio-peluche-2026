<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intercambio Navideño · Familia Peluche 2026</title>
  <meta name="description" content="Descubre a quién le vas a regalar este año 🎁" />
  <meta property="og:title" content="Intercambio Navideño · Familia Peluche 2026" />
  <meta property="og:description" content="Revisa quién te tocó y escribe tu carta 🎁" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Mountains+of+Christmas:wght@700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="snow" aria-hidden="true"></canvas>

  <main>
    <header class="hero">
      <p class="kicker">✨ 🎄 ✨</p>
      <h1>
        <span class="line1">Intercambio Navideño</span>
        <span class="line2">Familia Peluche</span>
        <span class="year">2026</span>
      </h1>
    </header>

    <section class="collage" id="collage" aria-label="Participantes"></section>

    <form class="card" id="form" autocomplete="off">
      <label for="word">Revisa quién te tocó y escribe tu carta</label>
      <input id="word" name="word" type="text" placeholder="Ingresa tu palabra secreta"
             autocapitalize="none" autocorrect="off" spellcheck="false" />
      <button id="go" type="submit" disabled>Continuar 🎁</button>
      <p class="error" id="error" role="alert"></p>
    </form>

  </main>

  <div class="reveal" id="reveal" hidden>
    <div class="reveal-inner">
      <div class="gift" id="gift">🎁</div>
      <div class="result" id="result">
        <h2 id="hello"></h2>
        <div class="pair">
          <figure class="p giver"><img id="giverImg" alt="" /><figcaption id="giverName"></figcaption></figure>
          <div class="arrow">➜</div>
          <figure class="p receiver"><img id="receiverImg" alt="" /><figcaption id="receiverName"></figcaption></figure>
        </div>
        <p class="hint">🤫 ¡Es secreto! No le digas a nadie.</p>
        <div class="mine" id="mine" hidden>
          <p id="mineStatus"></p>
          <button id="writeMine" type="button" class="ghost">✍️ Escribir mi carta</button>
        </div>
        <button id="close" type="button">Cerrar</button>
      </div>
    </div>
    <canvas id="confetti" aria-hidden="true"></canvas>
  </div>

  <div class="letter-modal" id="letterModal" hidden>
    <div class="stage" id="stage">
      <div class="envelope" aria-hidden="true">
        <div class="env-back"></div>
        <div class="flap"></div>
        <div class="pocket"></div>
        <div class="seal">❄</div>
      </div>
      <article class="letter" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
        <header>
          <img id="letterImg" alt="" />
          <div>
            <p class="to">Querido Santa:</p>
            <h3 id="letterTitle"></h3>
          </div>
        </header>
        <div class="letter-body" id="letterBody"></div>
        <form class="letter-edit" id="letterEdit" hidden>
          <textarea id="letterText" maxlength="2000" rows="8"
            placeholder="Este año me porté muy bien y me gustaría…&#10;&#10;Talla de ropa: …&#10;Colores favoritos: …"></textarea>
          <div class="edit-foot"><span id="count">0/2000</span><span class="edit-error" id="editError" role="alert"></span></div>
          <button type="submit" id="saveLetter">Guardar mi carta 🎄</button>
        </form>
        <p class="sign" id="letterSign"></p>
        <button type="button" class="letter-close" id="letterClose" aria-label="Cerrar">✕</button>
      </article>
    </div>
  </div>

  <div class="cena-modal" id="cenaModal" hidden>
    <div class="cena-wrap">
      <div class="papel" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div class="cena-card" role="dialog" aria-modal="true" aria-labelledby="cenaTitle">
        <div class="cena-icons" aria-hidden="true"><span>🫔</span><span>🍲</span><span>🍮</span><span>☕</span></div>
        <h3 id="cenaTitle">CENA</h3>
        <p class="cena-sub">de posada</p>
        <div class="cena-menu" id="cenaMenu"></div>
        <button type="button" class="cena-close" id="cenaClose" aria-label="Cerrar">✕</button>
      </div>
    </div>
  </div>

  <div class="games-modal" id="gamesModal" hidden>
    <div class="games-card" role="dialog" aria-modal="true" aria-labelledby="gamesTitle">
      <div class="games-ribbon" aria-hidden="true"><span>🎀</span></div>
      <div class="games-icons" aria-hidden="true"><span>🎲</span><span>🃏</span><span>🎯</span><span>🧩</span></div>
      <h3 id="gamesTitle">JUEGOS</h3>
      <p class="games-sub">para el intercambio</p>
      <ul class="games-list" id="gamesList"></ul>
      <p class="games-soon">¡más juegos pronto!</p>
      <div class="games-lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <button type="button" class="games-close" id="gamesClose" aria-label="Cerrar">✕</button>
    </div>
  </div>

  <div class="arrullo-modal" id="arrulloModal" hidden>
    <div class="arrullo-card" role="dialog" aria-modal="true" aria-labelledby="arrulloTitle">
      <div class="arrullo-star" aria-hidden="true">⭐</div>
      <div class="arrullo-video">
        <video id="arrulloVideo" src="img/nacimiento.mp4" poster="img/nacimiento-poster.jpg"
               playsinline controls preload="none"></video>
      </div>
      <h3 id="arrulloTitle">
        <span class="arrullo-lead">Este año arrullar al Niño le toca</span>
        <span class="arrullo-aaa" id="arrulloAaa" aria-label="aaaaa"></span>
      </h3>
      <p class="arrullo-ask">🗳️ ¿Quién crees que debe arrullarlo? ¡Vota!</p>
      <ul class="arrullo-list" id="arrulloList"></ul>
      <p class="arrullo-note" id="arrulloNote"></p>
      <button type="button" class="arrullo-close" id="arrulloClose" aria-label="Cerrar">✕</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
